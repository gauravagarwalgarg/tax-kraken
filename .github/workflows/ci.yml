name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs]"

      - name: Compile Python
        run: |
          python -m py_compile analysis.py tax_routing_simulation.py

      - name: Build docs
        run: |
          mkdocs build --strict

